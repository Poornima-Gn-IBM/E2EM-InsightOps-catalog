apiVersion: v1
kind: ServiceAccount
metadata:
  name: insightops-sa

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: insightops-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insightops-binding
subjects:
  - kind: ServiceAccount
    name: insightops-sa
roleRef:
  kind: Role
  name: insightops-role
  apiGroup: rbac.authorization.k8s.io